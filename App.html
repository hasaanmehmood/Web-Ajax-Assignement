<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 1rem;
    }

    .weather-app {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    input {
      padding: 0.8rem;
      width: 70%;
      border: none;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    button {
      padding: 0.8rem 1.5rem;
      border: none;
      background-color: #ffd700;
      color: #000;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #ffcc00;
    }

    #result {
      margin-top: 1.5rem;
      animation: fadeIn 0.5s ease-in-out;
    }

    .error {
      color: #ff6b6b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 500px) {
      input {
        width: 100%;
      }

      button {
        width: 100%;
        margin-top: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="weather-app">
    <h1>🌤️ Weather App</h1>
    <input type="text" id="city" placeholder="Enter city name" />
    <br />
    <button onclick="getWeather()">Get Weather</button>

    <div id="result"></div>
  </div>

  <script>
    async function getWeather() {
      const city = document.getElementById("city").value.trim();
      const result = document.getElementById("result");
      result.innerHTML = ""; // Clear previous result

      if (!city) {
        result.innerHTML = `<p class="error">❗ Please enter a city name.</p>`;
        return;
      }

      result.innerHTML = `<p>Loading weather data...</p>`;

      try {
        const response = await fetch(
          `https://api.weatherapi.com/v1/current.json?key=54757ae0ffa54238a0c233834251606&q=${encodeURIComponent(city)}&ts=${Date.now()}`
        );

        if (!response.ok) {
          throw new Error("Invalid response from API");
        }

        const data = await response.json();

        result.innerHTML = `
          <h2>${data.location.name}, ${data.location.country}</h2>
          <p>🌡️ Temperature: <strong>${data.current.temp_c}°C</strong></p>
          <p>☁️ Condition: <strong>${data.current.condition.text}</strong></p>
          <img src="https:${data.current.condition.icon}" alt="Weather Icon"/>
        `;
      } catch (error) {
        console.error(error);
        result.innerHTML = `<p class="error">❌ Could not fetch weather. Check the city name or try again later.</p>`;
      }
    }
  </script>
</body>
</html>
